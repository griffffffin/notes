<!doctype html>
<html class="bg-black" lang="hu">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-do</title>

    <!--
      A háttérszínt MÉG a stíluslapok és a React betöltése előtt beállítjuk.
      A .bg-black osztály önmagában kevés: az csak akkor hat, amikor a Bootstrap
      CSS már betöltött — addig a böngésző fehéret fest (látható villanás).
      A téma a cookie-ból jön, hogy a világos témát se villantsuk feketére.
    -->
    <!--
      A fontokat előre betöltetjük: a böngésző már a HTML olvasásakor elindítja
      a letöltésüket, így készen vannak az első kirajzoláskor. Enélkül a szöveg
      tartalék betűvel jelenik meg, majd a valódi font érkezésekor
      átméreteződik — ettől ugrálnak a navbar feliratai és az ikonok.
    -->
    <link rel="preload" href="/fonts/Caveat-SemiBold.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/Caveat-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/EncodeSansSemiExpanded-Regular.ttf" as="font" type="font/ttf" crossorigin />

    <!--
      A téma-kapcsoló nap/hold ikonjai és a nyitott szem (jelszó-megjelenítés):
      ugyanezért töltjük őket előre. Mindhárom a Vite 4 KB-os beágyazási küszöbe
      fölött van, tehát külön fájlként töltődnének le — a kirajzolás után, késve.
      (A csukott szem 3,4 KB, az beágyazódik a bundle-be, neki nem kell preload.)
    -->
    <link rel="preload" href="/icons/sun.png" as="image" type="image/png" />
    <link rel="preload" href="/icons/moon.png" as="image" type="image/png" />
    <link rel="preload" href="/icons/eye_of_providence.svg" as="image" type="image/svg+xml" />

    <style>
      html { background: #000; }
    </style>
    <script>
      // Reguláris kifejezéssel keresünk, nem pontos szövegegyezéssel: így akkor is
      // megtalálja, ha a süti értéke idézőjelbe kerül, vagy más sorrendben/térközzel
      // szerepel a cookie-sztringben.
      if (/(^|;\s*)backgroundColor="?white"?\s*(;|$)/.test(document.cookie))
        document.documentElement.style.background = "#fff";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

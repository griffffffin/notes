<!doctype html>
<!-- A régi class="bg-black" szándékosan NINCS itt: a Bootstrap .bg-black
     !important-os, ezért legyőzné a téma inline hátterét, és a világos témán is
     feketén tartaná a html-t (a tartalom alatti sáv fekete maradt). A hátteret a
     lenti boot-szkript és a ThemeProvider állítja. -->
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-do</title>

    <!--
      A háttérszínt MÉG a stíluslapok és a React betöltése előtt beállítjuk,
      különben a böngésző az első képkockát fehérrel festi (látható villanás).

      A színt NEM hardkódoljuk: a ThemeProvider a "themeBackground" sütibe írja a
      téma tényleges hátterét, mi pedig innen olvassuk. Így bármilyen új téma
      (kategóriánkénti színek) automatikusan működik — nem kell két helyen
      karbantartani. A lenti #000 csak a legelső látogatás alapértéke (amikor
      még nincs süti).
    -->
    <!--
      A fontokat előre betöltetjük: a böngésző már a HTML olvasásakor elindítja
      a letöltésüket, így készen vannak az első kirajzoláskor. Enélkül a szöveg
      tartalék betűvel jelenik meg, majd a valódi font érkezésekor
      átméreteződik — ettől ugrálnak a navbar feliratai és az ikonok.
    -->
    <link rel="preload" href="/fonts/Caveat-SemiBold.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/Caveat-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/EncodeSansSemiExpanded-Regular.ttf" as="font" type="font/ttf" crossorigin />

    <style>
      html { background: #000; }
    </style>
    <script>
      // A sütiből kiolvassuk a téma hátterét, és azzal festünk. Csak érvényes
      // színt fogadunk el (# + hex), hogy egy sérült süti ne törhesse el a lapot.
      var match = document.cookie.match(/(?:^|;\s*)themeBackground=([^;]*)/);
      if (match) {
        var color = decodeURIComponent(match[1]).replace(/^"|"$/g, "");
        if (/^#[0-9a-fA-F]{3,8}$/.test(color))
          document.documentElement.style.background = color;
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

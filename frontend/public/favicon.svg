<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <title>Jin-jang</title>
    <!-- Az arányok az eredeti 500x500-as képből mérve (a függőleges középvonal
         mentén nézve, hol vált fekete/fehér):
           keret:      a kép 1,4%-a
           szem közép:  26,2% és 73,8%
           szem sugár:  6,2%
         A sugár 49,3 (nem 50), hogy a rá rajzolt 1,4 széles keret fele se lógjon
         ki a viewBoxból. -->
    <circle cx="50" cy="50" r="49.3" fill="#fff" stroke="#000" stroke-width="1.4"/>
    <!-- A fekete mező EGYETLEN vonallal, felülről indulva:
         1. a jobb oldali félkör le,
         2. vissza fel egy fél akkora íven, ami BALRA hajlik — ettől nyúlik át a
            fekete a bal alsó részbe,
         3. tovább fel egy másik fél íven, ami JOBBRA hajlik — ez viszont a fehéret
            engedi át a jobb felső részbe.
         A 2. és 3. ellentétes hajlása (sweep 1, majd 0) adja az S-görbét. -->
    <path fill="#000" d="M50 0.7a49.3 49.3 0 0 1 0 98.6a24.65 24.65 0 0 1 0-49.3a24.65 24.65 0 0 0 0-49.3"/>
    <!-- A két szem: mindegyik a MÁSIK mezőben ül, a fél ívek középpontjában. -->
    <circle cx="50" cy="26.2" r="6.2" fill="#000"/>
    <circle cx="50" cy="73.8" r="6.2" fill="#fff"/>
</svg>

name: CI

# Egy "robot", ami a GitHubon minden változásnál leellenőrzi ugyanazt, amit
# helyben is futtatunk: lint, halott-kód, tesztek, build. Ha bármelyik elhasal
# (nem-nulla kilépési kód), a lépés PIROS lesz, és a commit/PR megbukik — ez a
# "kapu". A monorepo két csomagja (frontend + backend) külön, párhuzamos jobban
# fut, hogy egyik bukása se rejtse el a másikét, és gyorsabb is legyen.

on:
  push:
    branches: [main]
  pull_request:

# Gyors egymásutánban több push esetén a régebbi, még futó ellenőrzés eredménye
# már senkit nem érdekel (úgyis a legfrissebb commit számít), de a futók számára
# szabott keretet fogyasztja. A "group" ágankénti sorbanállót képez, a
# "cancel-in-progress" pedig az újabb indulásakor megszakítja az előzőt.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # A Pi éles Node-ja v22 — a CI ugyanezt használja, hogy ne "az én
          # gépemen működött" alapon térjen el a viselkedés.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci                 # tiszta, lockfile-hű telepítés (nem "install")
      # SUPPLY-CHAIN KAPU: a függőségek ismert sebezhetőségeit a lockfile alapján
      # nézi. A `moderate` küszöb a KRITIKUS+MAGAS+KÖZEPES besorolást blokkolja
      # (exit 1) — ide esnek a valódi web-sebezhetőségek (ReDoS, prototype
      # pollution, futásidejű XSS); a `low` sáv (jellemzően informatív, nem
      # javítható tranzitív zaj) nem borítja pirosra a CI-t. Ma 0 sebezhetőség
      # (l. [[jsdom-undici-audit-backlog]]). ⚠ Ha egy jövőbeli közepes advisory
      # DEV-only depben (vite/vitest — nem kerül az éles buildbe) fix nélkül
      # blokkol, ott kezeljük (dep-bump vagy `--omit=dev`). A `npm ci` a
      # lockfile-hoz nyúl, az audit is — a kettő ugyanazt a fát látja.
      - run: npm audit --audit-level=moderate
      - run: npm run lint           # oxlint — hibára bukik, a meglévő warningokra nem
      # A TÍPUS-TUDATOS RÉTEG. Külön lépés, mert külön motort hív
      # (oxlint-tsgolint): ez már nem a szintaxist nézi, hanem a típusokat —
      # innen jön a lebegő promise, a kötetlen metódus-hivatkozás és társaik.
      # Mérve: 144 fájl ~2 s, tehát a CI-nak sem kerül semmibe.
      - run: npm run lint:types
      # A TÍPUS-KAPU. Külön lépés, és SZÁNDÉKOSAN a build előtt: a `vite build`
      # a típushibás kódot is lefordítja (az esbuild kitörli a típusokat, de nem
      # ellenőrzi őket — lemérve: két típushibával is 0 kilépési kóddal futott le).
      # A tsc --noEmit az EGYETLEN, ami tényleg megnézi.
      - run: npm run typecheck
      - run: npm run knip           # keresztfájlos halott kód → exit 1 = bukás
      - run: npm test               # vitest (jsdom, DB nem kell)
      - run: npm run build          # a build maga is elhasal, ha valami törött

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # SUPPLY-CHAIN KAPU — ugyanaz, mint a frontendnél (moderate küszöb, lockfile-hű).
      - run: npm audit --audit-level=moderate
      - run: npm run lint           # oxlint — saját szabálykészlet, l. backend/.oxlintrc.json
      - run: npm run knip
      # node --test: a tesztek saját Express appot építenek és a Mongoose-modelleket
      # mockolják, ezért ADATBÁZIS NÉLKÜL is lefutnak — a CI-nek nem kell FerretDB.
      - run: npm test
